[project]
name = "retry-extended"
version = "0.3.0"
description = "Retry API compatible extended library"
authors = [
    {name = "Strollby Developers", email = "backend.developers@strollby.com"}
]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/strollby/retry-extended"
repository = "https://github.com/strollby/retry-extended"
documentation = "https://github.com/strollby/retry-extended"
keywords = [
    "retry",
    "retry-extended",
    "python-retry",
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

]

requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = [
    "ruff (>=0.15)"
]
test = [
    "pytest (>=8.4)",
    "pytest-asyncio (<1.3) ; python_version < '3.10'",
    "pytest-asyncio (>=1.3) ; python_version >= '3.10'"
]

[project.urls]
"Bug Tracker" = "https://github.com/strollby/retry-extended/issues"


[tool.poetry]
packages = [{ include = "retry" }]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.format]
quote-style = "double" # Like Black, use double quotes for strings.
indent-style = "space" # Like Black, indent with spaces, rather than tabs.
skip-magic-trailing-comma = true
line-ending = "auto" # Like Black, automatically detect the appropriate line ending.